name: Update GRTA standings

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-grta-standings.yml"
      - "scripts/update-grta-standings.mjs"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-grta-standings
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check tournament window
        id: window
        run: |
          if [ "$(date -u +%s)" -le "1788307199" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4
      - name: Setup Node
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect standings
        if: steps.window.outputs.active == 'true'
        run: node scripts/update-grta-standings.mjs assets/data/grta-standings.json
      - name: Publish changed snapshot
        if: steps.window.outputs.active == 'true'
        run: |
          if git diff --quiet -- assets/data/grta-standings.json; then
            echo "No new results."
            exit 0
          fi
          git config user.name "GRTA standings bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/grta-standings.json
          git commit -m "Update GRTA standings"
          git push
