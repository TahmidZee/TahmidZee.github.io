    Skills:
      - name: Wireless Communications and Physical Layer
        level: Research
        icon: fa-solid fa-signal
        keywords: "MIMO, antenna arrays, beamforming, CSI estimation, RIS/IRS, NOMA and SIC, modulation and detection, link budgets, path loss and fading, SNR, SINR, BER, throughput, spectral and energy efficiency, C-V2X, 5G NR-V2X, HARQ"
        highlights:
          - Multi-antenna and MIMO systems, antenna arrays and steering vectors, beamforming and phase control, CSI and channel estimation, large-scale RIS/IRS, NOMA and successive interference cancellation.
          - Digital modulation and detection, link budgets, path loss and fading, SNR/SINR/BER analysis, throughput, spectral and energy efficiency, C-V2X/NR-V2X, HARQ, and resource allocation.

      - name: Array Signal Processing and Wireless Sensing
        level: Research
        icon: fa-solid fa-wave-square
        keywords: "complex baseband and I/Q processing, covariance estimation, MUSIC, MVDR/Capon, spatial spectra, AoA and range estimation, near-field localization, geometric multipath channels, partial CSI reconstruction, automatic modulation recognition"
        highlights:
          - Complex baseband and I/Q processing, sample and learned covariance, MUSIC, MVDR/Capon, spatial spectra, AoA/range estimation, near-field and multi-source localization.
          - Geometric multipath and cascaded RIS channels, block fading and mobility models, partial/full CSI reconstruction, automatic modulation recognition, and low-SNR robustness.

      - name: Machine Learning for Communications
        level: Research
        icon: fa-solid fa-brain
        keywords: "PyTorch, TensorFlow, scikit-learn, CNNs, RNNs, LSTMs, transformers, FiLM and conditional networks, diffusion models, reinforcement learning, deep Q-learning, multi-objective learning, representation learning, hyperparameter optimization"
        highlights:
          - PyTorch, TensorFlow, scikit-learn, CNN/RNN/LSTM models, transformers, FiLM and conditional networks, diffusion models, reinforcement learning, deep Q-learning, multi-objective learning, representation learning, and hyperparameter optimization.

