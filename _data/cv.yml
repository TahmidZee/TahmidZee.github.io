        highlights:
          - Cellular networking and planning, 5G NR-V2X/C-V2X, latency and reliability, resource allocation, IoT/NMS, connected-vehicle security, context-aware anomaly analysis, Atoll, Cisco Packet Tracer, Linux, and user acceptance testing.

