research_themes:
  - icon: fa-solid fa-location-crosshairs
    title: Wireless sensing and localization
    description: Hybrid model-based and learned methods for multi-antenna, RIS-assisted, and near-field systems.
    tags:
      - MIMO / RIS
      - CSI & channels
      - MUSIC / MVDR
    url: /research/#learning-enabled-wireless-sensing-and-localization

  - icon: fa-solid fa-wave-square
    title: Learning for communications
    description: Signal-aware neural systems for channel reconstruction, modulation recognition, and low-SNR robustness.
    tags:
      - I/Q & AMR
      - Conditional ML
      - Low SNR
    url: /research/#signal-processing-and-machine-learning-for-communications

  - icon: fa-solid fa-shield-halved
    title: Trustworthy connected systems
    description: Context-aware reliability, resource allocation, and security for V2X and edge-assisted systems.
    tags:
      - C-V2X
      - Networking
      - Security
    url: /research/#trustworthy-connected-systems

core_expertise:
  - icon: fa-solid fa-tower-broadcast
    title: Wireless communications & physical layer
    summary: System-level and link-level reasoning across propagation, multi-antenna links, intelligent surfaces, and connected-vehicle communications.
    domains:
      - title: Physical-layer foundations
        items:
          - Complex baseband systems
          - Digital modulation & detection
          - Link budgets, path loss & fading
          - SNR, SINR & BER analysis
          - Throughput & spectral efficiency
      - title: MIMO, antennas & channel acquisition
        items:
          - Multi-antenna / MIMO systems
          - Antenna arrays & steering vectors
          - AoA / AoD channel geometry
          - Beamforming & phase control
          - CSI and channel estimation
      - title: RIS-assisted & connected wireless systems
        items:
          - Large-scale RIS / IRS
          - NOMA & successive interference cancellation
          - Pilot-overhead reduction
          - Energy efficiency & user fairness
          - C-V2X sidelink communication
          - HARQ retransmission & throughput analysis
    evidence:
      - label: ICCCN 2026
        url: /publications/#alam2026deep
      - label: C-V2X research
        url: /research/#trustworthy-connected-systems

  - icon: fa-solid fa-wave-square
    title: Array signal processing & wireless sensing
    summary: Model-based and learned estimation methods for spatial inference, channel reconstruction, and robust signal intelligence.
    domains:
      - title: Spatial estimation & localization
        items:
          - Sample and learned covariance
          - MUSIC and MVDR / Capon
          - Spatial spectra & peak detection
          - AoA, range & multi-source localization
          - Near-field spherical-wave modeling
      - title: Channels, propagation & sensing
        items:
          - Geometric multipath channels
          - Block fading & mobility models
          - Cascaded RIS channel modeling
          - Partial / full CSI reconstruction
          - Channel-quality conditioning
      - title: Signal intelligence
        items:
          - Raw complex I/Q processing
          - Automatic modulation recognition
          - Low-SNR robustness
          - Spatiotemporal signal features
          - Ablations & statistical testing
    evidence:
      - label: RIS localization
        url: /projects/ris-localization/
      - label: MILCOM manuscript
        url: /publications/#tahi2026brfilm

